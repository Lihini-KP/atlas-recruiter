<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>(function(){var t=localStorage.getItem('atlas-theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advertisement — ATLAS Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="with-sidebar">

<div id="sidebar-root"></div>

<header>
  <div class="brand">
    <h1>Advertisement</h1>
    <p>Posters generated automatically once HR approves a recruitment request.</p>
  </div>
</header>

<main>
  <section class="panel upload-form">
    <h2>Upload Advertisement</h2>
    <p class="kpi-note" style="margin-top:-10px;border-top:none;padding-top:0">Not happy with an auto-generated poster? Upload your own for a company/designation here.</p>
    <form id="upload-form">
      <div class="grid">
        <div class="field"><label>Company *</label><select name="companyId" id="upload-company" required></select></div>
        <div class="field"><label>Designation *</label><input name="designation" required /></div>
        <div class="field full"><label>Poster Image *</label><input type="file" name="posterFile" accept="image/*" required /></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn-primary" id="upload-btn">Upload Advertisement</button>
      </div>
      <div class="status hidden" id="upload-status"></div>
    </form>
  </section>

  <div id="main-content">
    <p class="kpi-note">Loading…</p>
  </div>
</main>

<style>
  .ad-group { margin-bottom: 24px; }
  .ad-group h2 { font-size: 15px; margin: 0 0 4px; }
  .ad-group .subhead { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  .ad-poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .ad-card {
    position: relative;
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    background: var(--panel);
  }
  .ad-card img { width: 100%; display: block; }
  .ad-card .ad-card-body { padding: 10px 12px; }
  .ad-card .ad-card-body div:first-child { font-size: 13px; font-weight: 600; }
  .ad-card .ad-card-body div:last-child { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .ad-card a.download { display: block; text-align: center; font-size: 12.5px; padding: 8px; border-top: 1px solid var(--border); text-decoration: none; color: var(--accent); }
  .ad-delete-btn {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .ad-delete-btn:hover { background: var(--red); }
  .ad-replace-btn {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .ad-replace-btn:hover { background: var(--accent); }
  .upload-form .grid { margin-bottom: 4px; }
</style>

<script src="lib/supabase-client.js"></script>
<script src="lib/sso.js"></script>
<script src="lib/auth-guard.js"></script>
<script src="lib/sidebar.js"></script>
<script>
const main = document.getElementById('main-content');
const uploadForm = document.getElementById('upload-form');
const uploadBtn = document.getElementById('upload-btn');
const uploadStatus = document.getElementById('upload-status');
const uploadCompanySelect = document.getElementById('upload-company');
let companies = [];

function posterUrl(path) {
  return sb.storage.from('advertisements').getPublicUrl(path).data.publicUrl;
}

function groupBy(items, keyFn) {
  const map = new Map();
  for (const item of items) {
    const key = keyFn(item);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return map;
}

function slugify(text) {
  return text.toString().trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

function extFromFilename(name) {
  const parts = name.split('.');
  return parts.length > 1 ? parts.pop().toLowerCase() : 'png';
}

async function loadCompanies() {
  const { data, error } = await sb.from('companies').select('id, name, code').order('name');
  if (error) return [];
  return data;
}

async function loadAds() {
  const { data, error } = await sb
    .from('advertisements')
    .select('*, recruitment_requests(department, companies(name))')
    .order('created_at', { ascending: false });

  if (error) {
    main.innerHTML = `<div class="status error">${error.message}</div>`;
    return;
  }

  if (!data.length) {
    main.innerHTML = '<p class="kpi-note">No advertisements yet. They appear automatically once HR approves a request, or upload your own above.</p>';
    return;
  }

  const byCompanyDept = groupBy(
    data,
    (ad) => `${ad.recruitment_requests?.companies?.name || companies.find((c) => c.code === ad.company_code)?.name || ad.company_code} / ${ad.recruitment_requests?.department || '—'}`
  );

  const isAdmin = window.currentProfile?.role === 'admin';
  const canEdit = ['hr', 'admin'].includes(window.currentProfile?.role);

  main.innerHTML = Array.from(byCompanyDept.entries())
    .map(([groupKey, ads]) => `
      <section class="panel ad-group">
        <h2>${groupKey}</h2>
        <div class="subhead">${ads.length} advertisement${ads.length > 1 ? 's' : ''}</div>
        <div class="ad-poster-grid">
          ${ads.map((ad) => `
            <div class="ad-card" data-id="${ad.id}" data-path="${ad.poster_storage_path}">
              ${canEdit ? `
                <button type="button" class="ad-replace-btn" data-id="${ad.id}" data-path="${ad.poster_storage_path}" title="Replace this poster image">🔄</button>
                <input type="file" accept="image/*" class="ad-replace-input hidden" data-id="${ad.id}" data-path="${ad.poster_storage_path}" />
              ` : ''}
              ${isAdmin ? `<button type="button" class="ad-delete-btn" data-id="${ad.id}" data-path="${ad.poster_storage_path}" title="Delete this advertisement">✕</button>` : ''}
              <img src="${posterUrl(ad.poster_storage_path)}" alt="${ad.designation}" loading="lazy" />
              <div class="ad-card-body">
                <div>${ad.designation}</div>
                <div>${new Date(ad.created_at).toLocaleDateString()}</div>
              </div>
              <a class="download" href="${posterUrl(ad.poster_storage_path)}" download target="_blank">Download</a>
            </div>
          `).join('')}
        </div>
      </section>
    `)
    .join('');

  main.querySelectorAll('.ad-delete-btn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const confirmed = confirm('Delete this advertisement permanently? This cannot be undone.');
      if (!confirmed) return;

      btn.disabled = true;
      btn.textContent = '…';

      const adId = btn.dataset.id;
      const path = btn.dataset.path;

      const { error: storageError } = await sb.storage.from('advertisements').remove([path]);
      const { error: dbError } = await sb.from('advertisements').delete().eq('id', adId);

      if (storageError || dbError) {
        alert('Delete failed: ' + (dbError?.message || storageError?.message));
        btn.disabled = false;
        btn.textContent = '✕';
        return;
      }

      loadAds();
    });
  });

  main.querySelectorAll('.ad-replace-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.ad-card');
      card.querySelector('.ad-replace-input').click();
    });
  });

  main.querySelectorAll('.ad-replace-input').forEach((input) => {
    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;

      const adId = input.dataset.id;
      const oldPath = input.dataset.path;
      const btn = main.querySelector(`.ad-replace-btn[data-id="${adId}"]`);
      btn.disabled = true;
      btn.textContent = '…';

      const ext = extFromFilename(file.name);
      const newPath = `manual/${adId}-${Date.now()}.${ext}`;

      const { error: uploadError } = await sb.storage.from('advertisements').upload(newPath, file, { contentType: file.type });
      if (uploadError) {
        alert('Upload failed: ' + uploadError.message);
        btn.disabled = false;
        btn.textContent = '🔄';
        return;
      }

      const { error: updateError } = await sb.from('advertisements').update({ poster_storage_path: newPath }).eq('id', adId);
      if (updateError) {
        alert('Replace failed: ' + updateError.message);
        btn.disabled = false;
        btn.textContent = '🔄';
        return;
      }

      await sb.storage.from('advertisements').remove([oldPath]);
      loadAds();
    });
  });
}

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const companyId = uploadCompanySelect.value;
  const company = companies.find((c) => c.id === companyId);
  const designation = uploadForm.designation.value.trim();
  const file = uploadForm.posterFile.files[0];

  if (!company || !designation || !file) {
    return;
  }

  uploadBtn.disabled = true;
  uploadBtn.innerHTML = '<span class="spinner"></span>Uploading…';
  uploadStatus.classList.add('hidden');

  try {
    const ext = extFromFilename(file.name);
    const path = `${company.code}/manual/${slugify(designation)}-${Date.now()}.${ext}`;

    const { error: uploadError } = await sb.storage.from('advertisements').upload(path, file, { contentType: file.type });
    if (uploadError) throw uploadError;

    const { error: insertError } = await sb.from('advertisements').insert({
      company_code: company.code,
      designation,
      poster_storage_path: path,
      published: false,
    });
    if (insertError) throw insertError;

    uploadForm.reset();
    loadAds();
  } catch (err) {
    uploadStatus.textContent = err.message;
    uploadStatus.className = 'status error';
    uploadStatus.classList.remove('hidden');
  } finally {
    uploadBtn.disabled = false;
    uploadBtn.textContent = 'Upload Advertisement';
  }
});

window.authReady.then(async (profile) => {
  if (!profile) return;
  renderSidebar('advertisement.html');
  if (!['hr', 'admin'].includes(profile.role)) {
    document.querySelector('.upload-form').classList.add('hidden');
    main.innerHTML = '<p class="kpi-note">You do not have access to this page.</p>';
    return;
  }
  companies = await loadCompanies();
  uploadCompanySelect.innerHTML = companies.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
  loadAds();
});
</script>

</body>
</html>
